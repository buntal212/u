name: uih-test

services:
  test-db:
    image: mysql:8.0.40
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_DATABASE: uih_test
      MYSQL_USER: uih_test
      MYSQL_PASSWORD: uih-test-only-password
      MYSQL_ROOT_PASSWORD: uih-test-root-only-password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UIH_UID: 1000
        UIH_GID: 1000
    working_dir: /var/www/html
    user: uih
    entrypoint: ["/bin/sh", "/var/www/html/docker/test-entrypoint.sh"]
    tmpfs:
      - /tmp
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: Udumbara Internal Hub
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_LOCALE: id
      APP_KEY: base64:dWloLXRlc3Rpbmcta2V5LW9ubHktMzJieXRlIQ==
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: test-db
      DB_PORT: "3306"
      DB_DATABASE: uih_test
      DB_USERNAME: uih_test
      DB_PASSWORD: uih-test-only-password
      DB_URL: ""
      DB_SOCKET: ""
      LARAVEL_STORAGE_PATH: /tmp/uih-test-storage
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: "4"
    depends_on:
      test-db:
        condition: service_healthy
