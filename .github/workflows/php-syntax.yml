name: PHP Syntax Check

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Lint PHP files
        run: |
          find app bootstrap config database lang public routes tests -type f -name "*.php" -print0 | xargs -0 -r -n 1 -P 4 php -l
          if [ -f artisan ]; then php -l artisan; fi
